# HOSHUTARO リリースワークフロー
#
# git タグ（v*）の push で起動し、Windows / macOS / Linux のデスクトップ
# インストーラをビルド・署名して GitHub Release（ドラフト）に添付する。
# Tauri Updater 用の latest.json と署名も tauri-action が生成する。
#
# 必要な GitHub Secrets と署名証明書の準備は docs/12_RELEASE_GUIDE.md を参照。
#
# 注: core（Python エンジン）の同梱は PyInstaller 単一バイナリ化の完了後に
#     tauri.conf.json の bundle.resources へ追加する（Track E 残作業）。
#     現状この workflow が生成するのは Tauri シェル本体のインストーラ。

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build, sign & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri Updater 署名鍵（npx tauri signer generate で作成）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS: Developer ID 署名 + notarization
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'HOSHUTARO ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Windows Authenticode 署名について:
  #   tauri-action は Apple 署名のような専用 env を持たないため、Windows は
  #   tauri.conf.json の bundle.windows.certificateThumbprint（ランナーの証明書
  #   ストアに導入した証明書）または Azure Trusted Signing で署名する。
  #   詳細な設定手順は docs/12_RELEASE_GUIDE.md を参照。
